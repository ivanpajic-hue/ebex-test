function e(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function commit(fn){const next=D.clone(S);const result=fn(next);D.processDeadlines(next);next.revision=(S.revision||0)+1;if(storageOK){try{localStorage.setItem(STORAGE,JSON.stringify(next));}catch(err){throw Error('Nema dovoljno mesta u pregledaču. Izvezi test i dodaj manje fotografija.');}}S=next;return result;}

function messagesView(){const cs=S.conversations,c=cs.find(c=>c.id===ui.chat)||cs[0];if(!c)return head('Tvoje poruke.','Dogovor ostaje na jednom mestu.')+empty('Započni razgovor.','Otvori oglas i pitaj prodavca.',link('Istraži oglase','market'));ui.chat=c.id;const l=S.listings.find(l=>l.id===c.listingId),seller=S.users[c.seller]||S.users.me;const mine=S.session.role==='seller'?c.seller:c.buyer;return `${crumb('Poruke')}${head('Dobar dogovor počinje razgovorom.','Sve poruke i formalne ponude ostaju u eBex-u.',btn('Testna uloga: '+(S.session.role==='seller'?'prodavac':'kupac'),'chat-role','','secondary'))}<div class="chat-layout"><aside class="conversation-list"><h3>Poruke <span class="muted">(${cs.length})</span></h3>${cs.map(x=>{const p=S.listings.find(l=>l.id===x.listingId);return '<button class="conversation '+(x.id===c.id?'active':'')+'" data-action="open-chat" data-id="'+e(x.id)+'"><img src="'+e(img(p||{}))+'" alt=""><span class="grow"><h4>'+e(p?.title||'Oglas')+'</h4><p>'+e(x.messages[x.messages.length-1]?.text||'Započni dogovor')+'</p></span></button>';}).join('')}</aside><section class="chat-main"><div class="chat-head"><span class="avatar sage">${e(seller.initials)}</span><div class="grow"><h3>${e(seller.name)} ${I('checkCircle','icon-sm text-green')}</h3><p><a href="#/listing/${e(l?.id)}">${e(l?.title)} · ${D.money(l?.price||0)}</a></p></div>${btn('Predloži cenu','offer','data-id="'+e(c.id)+'"','secondary small')}${btn(I('flag'),'report-chat','data-id="'+e(c.id)+'"','ghost small')}</div><div class="chat-safety">${I('shield')} Bez razmene kontakta i ličnog preuzimanja. Plaćaš BEX-u pri uručenju.</div><div class="chat-messages" id="chat-scroll">${c.messages.map(m=>'<div class="message '+(m.from===mine?'mine':'')+'"><div class="bubble">'+e(m.text)+'</div><div class="meta">'+(m.from===mine?'Ti':e(seller.name))+' · '+stamp(m.at)+'</div></div>').join('')}${c.offers.map(f=>`<div class="offer-card"><div class="row between"><span class="eyebrow">Formalna ponuda · ${f.from==='seller'?'prodavac':'kupac'}</span>${badge(new Date(f.expiresAt)<new Date(Date.now()+S.clock)&&f.status==='PENDING'?'EXPIRED':f.status)}</div><div class="price">${D.money(f.price)}</div><p class="small muted">Važi do ${stamp(f.expiresAt)} · BEX dostava se dodaje na iznos.</p>${f.status==='PENDING'?btn(f.from===(S.session.role==='seller'?'seller':'buyer')?'Promeni ulogu da prihvatiš':'Prihvati ponudu','accept-offer','data-conv="'+e(c.id)+'" data-id="'+e(f.id)+'"','secondary small'):''}${f.status==='ACCEPTED'&&l?.status==='ACTIVE'?btn('Nastavi na kupovinu pouzećem '+I('arrow'),'offer-checkout','data-conv="'+e(c.id)+'" data-id="'+e(f.id)+'"','small'):''}</div>`).join('')}</div><div id="chat-error"></div><form id="message-form" class="chat-input" data-id="${e(c.id)}"><input name="message" maxlength="1500" placeholder="${c.blocked?'Razgovor je blokiran':'Napiši poruku…'}" aria-label="Nova poruka" required ${c.blocked?'disabled':''}><button class="btn" type="submit" ${c.blocked?'disabled':''} aria-label="Pošalji poruku">${I('send')}</button></form></section></div>`;}
function premiumView(){const own=S.listings.filter(l=>l.seller==='me'&&l.status==='ACTIVE');return `${crumb('Premium')}${head('Tvoj oglas, malo više u centru pažnje.','Oglasi su besplatni. Isticanje biraš kada ti odgovara.')}<div class="tagline orange">${I('spark')}<span>Cene i trajanja ispod su testni parametri. Aktiviranje promocije ne naplaćuje novac.</span></div><div class="spacer"></div><div class="three-col">${S.config.plans.map((p,i)=>`<article class="plan ${i===1?'featured':''}"><div class="row between"><h3>${e(p.name)}</h3>${I(i===2?'spark':i===1?'star':'arrow','text-coral')}</div><p>${e(p.description)}</p><div class="price">${fmt(p.price)} <small>RSD</small></div><small class="muted">${p.days} dana · testna cena</small><ul><li>${I('check')}${i===0?'Povratak među najnovije':'Jasna premium oznaka'}</li><li>${I('check')}Više pažnje u ${i===2?'preporukama':'kategoriji'}</li><li>${I('check')}Bez automatske obnove</li></ul>${btn('Isprobaj '+e(p.name),'promote','data-id="'+e(p.id)+'"',i===1?'':'secondary')}</article>`).join('')}</div><div class="spacer"></div><section class="panel"><h3>Tvoji aktivni oglasi</h3>${own.length?own.map(l=>'<div class="seller-list"><img class="list-thumb" src="'+e(img(l))+'" alt=""><div class="grow"><h3>'+e(l.title)+'</h3><div class="meta">'+D.money(l.price)+'</div></div>'+(D.effectivePremium(l,S)?'<span class="badge orange">Promocija do '+date(l.premiumUntil)+'</span>':'<span class="badge gray">Standardni oglas</span>')+'</div>').join(''):empty('Prvo postavi oglas.','Onda možeš da isprobaš promociju.',link('Postavi oglas','sell'))}</section>`;}

t','','secondary small')}</div>${S.dataRequests.length?'<p class="small muted">'+S.dataRequests.length+' testnih zahteva je evidentirano za pregled.</p>':''}</section><section class="panel stack"><h3>Sačuvane pretrage</h3>${S.savedSearches.length?S.savedSearches.map((q,i)=>'<div class="mini-list"><span>'+e(q.query||D.categories.find(c=>c.id===q.category)?.name||'Svi oglasi')+'</span>'+btn('Otvori','load-search','data-index="'+i+'"','ghost small')+'</div>').join(''):'<p class="small muted">Sačuvaj pretragu sa početne strane.</p>'}</section></div>`;}

 else if(tab==='users')body=`<div class="panel flush"><div class="panel-head"><h3>Korisnici i odvojene verifikacije</h3><p class="small muted">Svi prikazani nalozi su sintetički.</p></div><div class="table-wrap"><table><thead><tr><th>Korisnik</th><th>Telefon</th><th>Identitet</th><th>Račun</th><th>Reputacija</th></tr></thead><tbody>${Object.values(S.users).map(u=>'<tr><td><span class="avatar sage">'+e(u.initials)+'</span> '+e(u.name)+'</td><td>'+badge(u.phone?'ACTIVE':'PENDING')+'</td><td>'+badge(u.identity?'ACTIVE':'PENDING')+'</td><td>'+badge(u.bank?'ACTIVE':'PENDING')+'</td><td>★ '+u.rating+' · '+u.trades+' transakcija</td></tr>').join('')}</tbody></table></div></div>`;

async function readPhoto(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Dozvoljene su JPG, PNG i WebP fotografije.');if(file.size>8*1024*1024)throw Error('Fotografija mora biti manja od 8 MB.');const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('Fotografija nije mogla da se učita.'));r.readAsDataURL(file);});const image=await new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=()=>reject(Error('Datoteka nije ispravna fotografija.'));image.src=data;});const max=900,scale=Math.min(1,max/Math.max(image.naturalWidth,image.naturalHeight));const canvas=document.createElement('canvas');canvas.width=Math.round(image.naturalWidth*scale);canvas.height=Math.round(image.naturalHeight*scale);const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);return {name:file.name,data:canvas.toDataURL('image/jpeg',.76),size:file.size};}

function sellerShell(tab,body){const tabs=[['overview','Pregled'],['listings','Oglasi'],['transactions','Transakcije'],['shipping','BEX pošiljke'],['finance','Pouzeće i isplate'],['disputes','Sporovi i povrati'],['inventory','Zalihe'],['import','Grupni uvoz'],['reports','Izveštaji']],visible=ui.workspaceMode==='simple'?tabs.slice(0,3):tabs;return `${crumb('Moj eBex / Prodaja i zalihe')}<div class="workspace-top"><div><div class="eyebrow">MOJ EBEX <span class="version-label">1.3</span></div><h1>Prodaja i zalihe</h1><p>${e(S.users[S.session.user].name)} · isključivo tvoji demo podaci</p></div><div class="row wrap"><div class="workspace-mode">${['simple','extended'].map(mode=>'<button data-action="v13-workspace-mode" data-id="'+mode+'" class="'+(ui.workspaceMode===mode?'active':'')+'">'+(mode==='simple'?'Jednostavno':'Prošireno')+'</button>').join('')}</div>${link(I('plus')+' Novi oglas','sell','btn')}</div></div><nav class="workspace-tabs" aria-label="Panel prodavca">${visible.map(([id,name])=>'<a class="'+(tab===id?'active':'')+'" href="#/seller/'+id+'">'+name+'</a>').join('')}</nav>${body}`;}
function listingRows(ls){return ls.map(l=>[ '<a href="#/listing/'+e(l.id)+'"><b>'+e(l.title)+'</b></a><div class="table-sub">'+e(l.sku||S.inventory[l.id]?.sku||'—')+' · '+e(l.brand||'Bez brenda')+'</div>',D.money(l.price),badge(l.status),'<b>'+e(S.inventory[l.id]?S.inventory[l.id].on_hand-S.inventory[l.id].reserved:0)+'</b><div class="table-sub">raspoloživo</div>',l.status==='DRAFT'?vbtn('Dopuni nacrt','edit-draft','data-id="'+e(l.id)+'"','secondary small'):['ACTIVE','PAUSED'].includes(l.status)?vbtn('Izmeni','edit-own','data-id="'+e(l.id)+'"','secondary small')+' '+btn(l.status==='ACTIVE'?'Pauziraj':'Aktiviraj','toggle-listing','data-id="'+e(l.id)+'"','ghost small'):link('Detalji','listing/'+l.id,'text-btn')]);}
function transactionRows(os){return os.map(o=>['<a href="#/orders/'+e(o.id)+'"><b>'+e(o.id)+'</b></a><div class="table-sub">'+e(o.snapshot.title)+'<br>'+date(o.createdAt)+'</div>',D.money(o.price),badge(o.status),badge(o.shipmentStatus),badge(o.codStatus),badge(o.payoutStatus),link('Detalji','orders/'+o.id,'text-btn')]);}
function financeRows(os){return os.map(o=>[link(e(o.id),'orders/'+o.id,'text-btn'),o.codStatus==='COLLECTED'?D.money(o.total):'Nije naplaćeno',o.payoutStatus==='PAID'?D.money(o.price):'Nije potvrđena isplata',badge(o.payoutStatus),o.paidAt?stamp(o.paidAt):o.payoutDueAt?date(o.payoutDueAt)+' · očekivano':'Posle uručenja','<span class="quote-ref">'+e(o.shipment)+'<br>BEX simulator · '+stamp(o.paidAt||o.deliveredAt||o.createdAt)+'</span>']);}
function sellerView(){const tab=route()[1]||'overview',{listings:ls,orders:os}=ownData();let body='';
 if(tab==='overview'){const paid=os.filter(o=>o.payoutStatus==='PAID'),cod=os.filter(o=>o.codStatus==='COLLECTED');body=`<div class="stat-grid">${stat('Aktivni oglasi',ls.filter(l=>l.status==='ACTIVE').length,'Samo oglasi ovog naloga.','tag')}${stat('Porudžbine',os.length,'Sve transakcije ovog naloga.','box')}${stat('BEX naplatio pouzeće',D.money(cod.reduce((a,o)=>a+o.total,0)),'Sintetičke potvrde naplate.','wallet')}${stat('Potvrđene isplate',D.money(paid.reduce((a,o)=>a+o.price,0)),'Isključivo evidentirani BEX transferi.','checkCircle')}</div><div class="v13-shortcuts">${link(I('upload')+' Uvezi CSV / XLSX','seller/import','btn secondary')}${link(I('chart')+' 15 grupa izveštaja','seller/reports','btn secondary')}${link(I('box')+' Proveri zalihe','seller/inventory','btn secondary')}</div><div class="two-col"><section class="panel"><div class="row between"><h3>Poslednje transakcije</h3>${link('Sve','seller/transactions','text-btn')}</div><div class="spacer"></div>${os.slice(0,3).map(orderCard).join('')}</section><section class="stack"><div class="panel stack"><h3>Tvoji naredni koraci</h3>${ls.filter(l=>l.status==='DRAFT').length?'<p>'+ls.filter(l=>l.status==='DRAFT').length+' nacrta čeka fotografije i potvrdu.</p>':'<p class="small muted">Nema nedovršenih uvoza.</p>'}${ls.filter(l=>l.status==='PENDING_REVIEW').length?'<p>'+ls.filter(l=>l.status==='PENDING_REVIEW').length+' oglasa na moderatorskom pregledu.</p>':''}<p class="small muted">Pre prve isplate potvrdi identitet i račun istog lica. Rok prenosa određuje odobreni BEX postupak.</p>${link('Profil i provere','profile','btn secondary')}${link('Pogledaj izuzetke','seller/reports/exceptions','text-btn')}</div><div class="finance-notice">Ovo je evidencija BEX naplata i transfera. eBex ne vodi novčani račun prodavca.</div></section></div>`;}
 else if(tab==='listings')body=sellerFilters()+`<div class="panel flush"><div class="panel-head row between wrap"><h3>Oglasi · ${ls.length}</h3><div class="row wrap">${vbtn('CSV','export-current','data-format="csv"','secondary small')}${vbtn('XLSX','export-current','data-format="xlsx"','secondary small')}</div></div>${table(['Oglas / SKU','Cena predmeta','Status','Količina','Radnja'],listingRows(ls))}</div>`;
 else if(tab==='transactions')body=sellerFilters()+`<div class="mini-kpis">${stat('Porudžbine',os.length,'Isti skup kao u tabeli.','box')}${stat('Vrednost robe',D.money(os.filter(o=>!['CANCELLED','SHIPMENT_EXPIRED'].includes(o.status)).reduce((a,o)=>a+o.price,0)),'Bez otkazanih porudžbina i poštarine.','tag')}${stat('Isplaćeno',D.money(os.filter(o=>o.payoutStatus==='PAID').reduce((a,o)=>a+o.price,0)),'BEX potvrde iz ovog skupa.','wallet')}</div><section class="panel flush"><div class="panel-head row between wrap"><h3>Transakcioni centar</h3><div class="row">${vbtn('CSV','export-current','data-format="csv"','secondary small')}${vbtn('XLSX','export-current','data-format="xlsx"','secondary small')}</div></div>${table(['Porudžbina','Vrednost robe','Porudžbina','BEX dostava','Pouzeće','Isplata',''],transactionRows(os))}</section>`;
 else if(tab==='shipping')body=sellerFilters()+`<section class="panel flush"><div class="panel-head"><h3>Praćenje BEX pošiljaka</h3><p class="small muted">Izvor: lokalni BEX simulator. Stvarni događaji stižu tek kroz odobren API.</p></div>${table(['Pošiljka','Porudžbina','Logistika','Datum uručenja','Dokaz',''],os.map(o=>['<span class="quote-ref">'+e(o.shipment)+'</span>',e(o.id),badge(o.shipmentStatus),o.deliveredAt?stamp(o.deliveredAt):'Nije uručeno',o.evidence.length?'Evidentiran':o.proofRequired?'Obavezan · nedostaje':'Preporučen',link('Prati','orders/'+o.id,'text-btn')]))}</section>`;
 else if(tab==='finance')body=sellerFilters()+`<div class="finance-notice">Naplaćeno pouzeće uključuje iznos koji je kupac platio BEX-u. Potvrđena isplata prikazuje iznos robe prenet prodavcu. Očekivani datum nije dokaz izvršenog transfera.</div><div class="spacer"></div><section class="panel flush"><div class="panel-head"><h3>BEX pouzeće i isplate</h3></div>${table(['Transakcija','Naplaćeno pouzeće','Potvrđeni transfer','Status','Vreme','Izvor i referenca'],financeRows(os))}</section>`;
 else if(tab==='disputes'){const disputed=os.filter(o=>o.dispute||S.postalComplaints.some(p=>p.orderId===o.id));body=sellerFilters()+alertBox('Problem sa kupovinom i poštanska reklamacija BEX-u vode se odvojeno. Otvaranje spora samo po sebi ne zaustavlja isplatu.','blue','flag')+'<div class="spacer"></div>'+table(['Porudžbina','C2C spor','Poštanski postupak','Isplata','Radnja'],disputed.map(o=>[e(o.id),o.dispute?e(o.dispute.reason)+'<br>'+badge(o.dispute.status):'Nije otvoren',S.postalComplaints.some(p=>p.orderId===o.id)?'Zahtev BEX-u za pregled':'Nije otvoren',badge(o.payoutStatus),link('Detalji','orders/'+o.id,'text-btn')]));}
 else if(tab==='inventory')body=sellerFilters()+inventoryView(ls);
 else if(tab==='import')body=importView();
 else if(tab==='reports'){if(route()[2]&&REPORTS.some(r=>r[0]===route()[2]))ui.report=route()[2];body=reportsView();}
 else body=empty('Izaberi radnu površinu.','Koristi meni svog prodajnog panela.');return sellerShell(tab,body);
}
function inventoryView(ls){const sum=k=>ls.reduce((n,l)=>n+(S.inventory[l.id]?.[k]||0),0);return `<div class="mini-kpis">${stat('Fizičko stanje',sum('on_hand'),'Evidentirana roba ovog naloga.','box')}${stat('Rezervisano',sum('reserved'),'Potvrđene otvorene kupovine.','lock')}${stat('Raspoloživo',sum('on_hand')-sum('reserved'),'Stanje umanjeno za rezervacije.','checkCircle')}</div><section class="panel flush"><div class="panel-head row between wrap"><div><h3>Opciona evidencija zaliha</h3><p class="small muted">Jedan C2C predmet. Svaka korekcija ima razlog i istoriju.</p></div>${vbtn('Izvezi XLSX','export-current','data-format="xlsx"','secondary small')}</div>${table(['Predmet / SKU','Stanje','Rezervisano','Raspoloživo','Radnja'],ls.map(l=>{const x=S.inventory[l.id]||{on_hand:0,reserved:0};return [e(l.title)+'<div class="table-sub">'+e(x.sku)+'</div>',x.on_hand,x.reserved,x.on_hand-x.reserved,vbtn('Korekcija','stock-adjust','data-id="'+e(l.id)+'"','secondary small')+' '+vbtn('Istorija','stock-history','data-id="'+e(l.id)+'"','ghost small')];}))}</section><div class="spacer"></div>${alertBox('Povrat robe ne povećava automatski raspoloživu količinu. Prodavac prvo potvrđuje fizički prijem i stanje na detalju povratne transakcije.','blue','refresh')}`;}
function importView(){const x=ui.importData;return `<div class="page-head"><div><h2>Grupni uvoz oglasa</h2><p>CSV i XLSX → mapiranje → provera → potvrda → nacrti.</p></div><div class="row wrap">${vbtn('CSV šablon','template','data-format="csv"','secondary small')}${vbtn('XLSX šablon','template','data-format="xlsx"','secondary small')}</div></div>${!x?`<section class="import-drop">${I('upload','icon-lg')}<h3>Dodaj tabelu svojih predmeta</h3><p>UTF-8 CSV sa „;” ili „,” separatorom, ili XLSX. Do ${S.config.importMaxRows} redova i ${S.config.importMaxMB} MB.</p><label class="btn">Izaberi CSV / XLSX<input type="file" data-vupload="table" accept=".csv,.xlsx,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" class="hide"></label><div class="spacer"></div>${vbtn('Isprobaj mešoviti demo uvoz','import-demo','','secondary')}</section>`:`<section class="panel stack"><div class="row between wrap"><div><h3>${e(x.name)}</h3><p class="small muted">${x.table.length-1} redova · ${x.table[0].length} kolona</p></div>${vbtn('Nova datoteka','import-reset','','ghost small')}</div><div class="steps">${['Tabela','Mapiranje','Provera','Nacrti'].map((t,i)=>'<div class="step '+(i<=(x.job?3:x.validated?2:1)?'active':'')+'"><span>'+(i+1)+'</span>'+t+'</div>').join('')}</div>${x.job?`<div class="import-progress"><span style="width:100%"></span></div>${alertBox(x.job.listingIds.length+' neobjavljenih nacrta je sačuvano. Svaki oglas traži fotografiju, potvrdu prodavca i standardnu moderaciju.','','checkCircle')}${link('Otvori nacrte','seller/listings','btn secondary')}`:`<form id="v13-import-map" class="stack"><div data-error></div><h3>Mapiraj kolone</h3><div class="import-mapping">${D.importFields.map(k=>'<label class="field">'+e(k)+'<select name="'+k+'"><option value="">Nije mapirano</option>'+x.table[0].map((h,i)=>'<option value="'+i+'" '+(String(x.mapping[k])===String(i)?'selected':'')+'>'+e(h)+'</option>').join('')+'</select></label>').join('')}</div><button type="submit" class="btn secondary">Proveri redove</button></form>`}${x.validated?`<div class="mini-kpis">${stat('Spremno za nacrt',x.validated.filter(r=>r.status==='READY').length,'Bez automatske javne objave.','checkCircle')}${stat('Potrebna ispravka',x.validated.filter(r=>r.status==='INVALID').length,'Greške su prikazane po redu.','flag')}${stat('Duplikati',x.validated.filter(r=>r.status==='DUPLICATE').length,'Ne kreiraju dodatne oglase.','refresh')}</div>${table(['Red / ID','Naslov','Rezultat','Greške'],x.validated.map(r=>[r.row+' · '+e(r.key),e(r.data.naslov),badge(({READY:'READY_DRAFT',INVALID:'INVALID',DUPLICATE:'DUPLICATE'})[r.status]),r.errors.map(e).join('<br>')||'—']))}<div class="row wrap">${vbtn('Izveštaj po redovima · CSV','import-errors','','secondary small')}${!x.job?`<form id="v13-import-confirm" class="stack"><label class="checkline"><input type="checkbox" name="confirm" required>Pregledao/la sam redove. Kreiraj samo ispravne nacrte.</label><button type="submit" class="btn" ${!x.validated.some(r=>r.status==='READY')?'disabled':''}>Kreiraj neobjavljene nacrte</button></form>`:''}</div>`:''}</section>`}<div class="spacer"></div>${alertBox('Masovni uvoz ne odobrava profesionalnu B2C prodaju. C2C količina je 1; spoljne fotografije se ne preuzimaju. Originale dopunjavaš u nacrtu.','orange','shield')}<div class="spacer"></div><section class="panel flush"><div class="panel-head"><h3>Istorija tvojih uvoza</h3></div>${table(['Posao / vreme','Datoteka','Nacrti','Status','Radnja'],S.imports.filter(j=>j.seller===S.session.user).map(j=>[e(j.id)+'<div class="table-sub">'+stamp(j.at)+'</div>',e(j.name),j.listingIds.length,badge(j.status),vbtn('Povuci neobjavljene','withdraw-import','data-id="'+e(j.id)+'"','ghost small')]))}</section>`;}
function reportData(kind=ui.report){const {listings:ls,orders:os}=ownData(),sales=os.filter(o=>!['CANCELLED','SHIPMENT_EXPIRED'].includes(o.status)),sum=(a,k)=>a.reduce((n,x)=>n+(Number(x[k])||0),0),money=n=>Math.round(n)/100,age=t=>Math.max(0,Math.floor((Date.now()+S.clock-new Date(t))/864e5));let headers=[],rows=[],unit='broj',definition='',chartColumn=1,notes='Samo podaci ovog prodavca; sintetički skup za testiranje.';
 const inv=l=>S.inventory[l.id]||{on_hand:0,reserved:0},group=(arr,key)=>{const m=new Map();for(const x of arr){const k=key(x);if(!m.has(k))m.set(k,[]);m.get(k).push(x);}return [...m];};
 if(kind==='sales'){headers=['Porudžbina','Jedinice','Vrednost robe RSD','Uručeno','Status'];rows=sales.map(o=>[o.id,1,money(o.price),o.shipmentStatus==='DELIVERED'?'Da':'Ne',label(o.status)]);definition='Jedinice = zbir aktivno ugovorenih jedinica; vrednost robe = zbir cena bez poštarine, otkazanih porudžbina i isteklih predaja.';chartColumn=2;unit='RSD';}
 if(kind==='listings'){headers=['Oglas','Pregledi','Kontakti','Ponude','Prodato','Konverzija %'];rows=ls.map(l=>{const sold=sales.filter(o=>o.listingId===l.id&&o.shipmentStatus==='DELIVERED').length;return [l.title,l.views||0,l.contacts||0,l.offers||0,sold,l.views?Math.round(sold/l.views*10000)/100:0];});definition='Konverzija = uručene prodaje / evidentirani pregledi oglasa × 100. Učinak se zasniva na sintetičkim demo brojačima.';}
 if(kind==='flow'){headers=['Status narudžbine','Broj porudžbina','Vrednost robe RSD'];rows=group(os,o=>label(o.status)).map(([k,a])=>[k,a.length,money(sum(a,'price'))]);definition='Broj porudžbina = broj jedinstvenih ID-jeva u izabranom statusu; status isplate je zasebna dimenzija.';}
 if(kind==='logistics'){headers=['Porudžbina','BEX status','Dana do uručenja','Uručeno','Pošiljka'];rows=os.map(o=>[o.id,label(o.shipmentStatus),o.deliveredAt?Math.max(0,Math.round((new Date(o.deliveredAt)-new Date(o.createdAt))/864e5*10)/10):'Nema potvrde',o.deliveredAt?date(o.deliveredAt):'—',o.shipment]);definition='Trajanje = potvrđeno vreme uručenja minus vreme porudžbine, u danima. Bez potvrde nema procenjenog datuma uručenja.';chartColumn=2;unit='dana';}
 if(kind==='cod'){headers=['Porudžbina','COD naplaćeno RSD','Isplata potvrđena RSD','Očekivani iznos robe RSD','Status isplate','BEX referenca'];rows=os.map(o=>[o.id,o.codStatus==='COLLECTED'?money(o.total):0,o.payoutStatus==='PAID'?money(o.price):0,money(o.price),label(o.payoutStatus),o.shipment]);definition='Naplaćeni COD i potvrđeni transfer su različiti događaji. COD uključuje poštarinu u ovom demo režimu; isplata prodavcu odnosi se na robu.';unit='RSD';}
 if(kind==='disputes'){headers=['Porudžbina','Vrsta predmeta','Razlog','Status','Trajanje dana'];rows=os.flatMap(o=>[...(o.dispute?[[o.id,'C2C spor',o.dispute.reason,label(o.dispute.status),age(o.dispute.openedAt)]]:[]),...S.postalComplaints.filter(p=>p.orderId===o.id).map(p=>[o.id,'BEX poštanski pregled',p.reason,label(p.status),age(p.at)])]);definition='C2C i poštanski predmeti broje se odvojeno. Finansijski efekat postoji samo po posebnom potvrđenom BEX događaju.';chartColumn=4;unit='dana';}
 if(kind==='inventory'){headers=['Oglas / SKU','Fizičko stanje','Rezervisano','Raspoloživo','Status'];rows=ls.map(l=>[l.title+' / '+inv(l).sku,inv(l).on_hand,inv(l).reserved,inv(l).on_hand-inv(l).reserved,label(l.status)]);definition='Raspoloživo = fizičko stanje − rezervisano. Povrat se knjiži tek nakon fizičke potvrde prodavca.';chartColumn=3;}
 if(kind==='age'){headers=['Oglas','Dana od kreiranja','Fizičko stanje','Uručene jedinice','Obrt'];rows=ls.map(l=>[l.title,age(l.createdAt),inv(l).on_hand,sales.filter(o=>o.listingId===l.id&&o.shipmentStatus==='DELIVERED').length,'Nedovoljno periodičnih stanja']);definition='Starost = testni datum − datum kreiranja. Pouzdan obrt traži prosečnu zalihu kroz vreme; ovaj demo ga ne izmišlja.';unit='dana';}
 if(kind==='brands'){headers=['Kategorija / brend / model','Porudžbine','Vrednost robe RSD','Uručeno'];rows=group(sales,o=>{const l=S.listings.find(l=>l.id===o.listingId)||o.snapshot;return (D.categories.find(c=>c.id===l.category)?.name||l.category)+' / '+(l.brand||'Bez brenda')+' / '+(getModel(l.model)?.name||'Bez modela');}).map(([k,a])=>[k,a.length,money(sum(a,'price')),a.filter(o=>o.shipmentStatus==='DELIVERED').length]);definition='Agregacija sopstvenih porudžbina po klasifikaciji predmeta. Prazan brend ili model se ne pretpostavlja.';chartColumn=2;unit='RSD';}
 if(kind==='prices'){headers=['Oglas','Datum promene','Cena predmeta RSD','Ostvarena cena RSD','Dogovorni popust %'];rows=ls.flatMap(l=>(l.priceHistory?.length?l.priceHistory:[{price:l.price,at:l.createdAt}]).map(h=>{const o=sales.find(o=>o.listingId===l.id);return [l.title,date(h.at),money(h.price),o?money(o.price):'Nema prodaje',o&&h.price?Math.round((h.price-o.price)/h.price*10000)/100:'—'];}));definition='Cenovni trend je istorija sopstvene cene predmeta. Dogovorni popust se računa prema zabeleženoj ceni predmeta, nikada prema BEX poštarini.';chartColumn=2;unit='RSD';}
 if(kind==='promotions'){headers=['Oglas','Demo aktivacije','Pregledi','Potvrđen trošak RSD','ROI'];rows=ls.filter(l=>S.premiumPurchases.some(p=>p.listingId===l.id)||l.premiumUntil).map(l=>[l.title,S.premiumPurchases.filter(p=>p.listingId===l.id).length,l.views||0,0,'Nije primenljivo bez plaćene kampanje']);definition='Demo promocije su besplatne. Nema izračunatog ROI-ja dok ne postoje potvrđeni troškovi i atribucija.';chartColumn=2;}
 if(kind==='result'){headers=['Porudžbina','Uručena roba RSD','Nabavni trošak RSD','Poznate naknade RSD','Procenjeni rezultat RSD'];rows=sales.filter(o=>o.shipmentStatus==='DELIVERED').map(o=>{const l=S.listings.find(l=>l.id===o.listingId),cost=l?.cost;return [o.id,money(o.price),Number.isSafeInteger(cost)?money(cost):'Nije uneto',0,Number.isSafeInteger(cost)?money(o.price-cost):'Nedovoljno ulaza'];});definition='Procena = uručena vrednost robe − uneti nabavni trošak − poznate naknade. Bez troška nema marže. Nije poreski ni računovodstveni obračun.';chartColumn=4;unit='RSD';}

 if(kind==='exceptions'){headers=['Predmet / referenca','Vrsta izuzetka','Sledeći korak'];rows=ls.flatMap(l=>[...(['DRAFT','PENDING_REVIEW'].includes(l.status)?[[l.title,label(l.status),'Dopuni ili sačekaj pregled']]:[]),...(!l.photos?.length?[[l.title,'Nema korisničke fotografije','Dodaj stvarne fotografije u produkciji']]:[]),...(l.model&&!getModel(l.model)?.verified?[[l.title,'Nepotvrđene specifikacije','Ručni pregled modela']]:[])]);rows.push(...os.filter(o=>o.dispute&&o.dispute.status!=='RESOLVED').map(o=>[o.id,'Otvoren C2C spor','Pregledaj dokaze bez samovoljne blokade isplate']));definition='Izuzeci su kontrolna lista podataka i procesa, bez automatske sankcije ili finansijske odluke.';}
 if(kind==='custom'){const base=reportData(ui.customBase||'sales');return {...base,kind:'custom',definition:'Prilagođeni prikaz koristi isti skup i definicije kao „'+REPORTS.find(r=>r[0]===(ui.customBase||'sales'))[1]+'”. Sačuvani su samo filteri i kolone.'};}
 return {kind,headers,rows,definition,chartColumn,unit,notes};
}

function scenario(kind){let id;commit(s=>{const l=D.clone(s.listings.find(l=>l.id==='l1'));Object.assign(l,{id:D.uid('scenario'),title:'Demo · '+({success:'standardna kupovina',hold:'C2C spor bez blokade',legalhold:'posebna BEX potvrda',after:'prijava posle isplate',proof:'dokaz pakovanja',return:'BEX povrat'})[kind],status:'ACTIVE',seller:'s1'});s.listings.push(l);D.enrich(s);s.session.role='buyer';const address={name:'Test Kupac',street:'Test adresa 1',city:'Beograd',postal:'11000'};s.config.quoteAvailable=true;const q=D.issueQuote(s,l.id,'home',address),o=D.createOrder(s,{listingId:l.id,address,delivery:'home',quoteId:q.id,requestId:D.uid('scenario')});id=o.id;s.session.role='seller';D.confirmSeller(s,id);if(kind!=='success'&&kind!=='proof'){o.evidence.push({name:'Probne fotografije pakovanja',demo:true});D.simulate(s,id,'DELIVERED');if(kind==='after'){s.clock+=2*864e5;D.simulate(s,id,'PAYOUT');}D.complain(s,id,'Stanje odstupa od opisa','Izmišljen opis za proveru korisničkog C2C spora.');if(['legalhold','return'].includes(kind)){s.config.holdLegalApproved=true;s.session.role='admin';s.session.adminRole='super';D.requestHold(s,id,'SIMULIRAN pravni osnov za lokalni testni scenario.');D.simulate(s,id,'HOLD_CONFIRM');}}D.audit(s,'DEMO','SCENARIO_CREATED',kind,id);});go('orders/'+id);toast('Kreirana je zasebna testna transakcija.');}

function orderWorkflow14(o){const pending=o.status==='RESERVED_PENDING_SELLER_CONFIRMATION',seller=o.seller===S.session.user&&S.session.role==='seller'||S.session.testing&&['seller','admin'].includes(S.session.role),buyer=o.buyer===S.session.user||S.session.testing&&S.session.role==='buyer';let text=o.shipmentStatus==='IN_TRANSIT'?'BEX prevozi paket. Prati sledeće obaveštenje.':o.codStatus==='COLLECTED'?'Pouzeće je naplaćeno. Isplata se prikazuje tek kada stigne potvrda.':'Prati status i sledeći korak.';
 if(pending)text='Predmet je rezervisan. Čeka se potvrda dostupnosti prodavca do '+stamp(o.sellerConfirmBy)+'. Preostalo: '+countdown14(o.sellerConfirmBy)+'.';if(o.status==='CANCELLED')text=(o.cancellationReason||'Narudžbina je otkazana')+'. Pouzeće nije naplaćeno.';if(o.status==='AWAITING_SHIPMENT')text='Prodavac je potvrdio dostupnost. Paket treba predati BEX-u do '+stamp(o.deadlineAt)+'.';if(o.status==='AWAITING_BUYER_DELIVERY_CONFIRMATION')text='Cena dostave se promenila. Pošiljka još nije kreirana. Kupac treba da prihvati nove uslove ili zatraži otkazivanje.';if(o.status==='SHIPMENT_PREPARATION_DUE')text='Rok pripreme je istekao. Potrebna je provera predaje sa podrškom.';if(o.payoutStatus==='PAID')text='BEX simulator je potvrdio isplatu. Eventualni problem sa kupovinom rešava se zasebno.';
 const cases=S.supportCases.filter(c=>c.orderId===o.id);return `<section class="panel workflow14 stack"><div class="row between wrap"><h3>Šta sledi</h3>${pending?'<span class="badge orange">Čeka prodavca</span>':''}</div><p>${e(text)}</p><div class="row wrap">${pending&&seller?b14('Potvrdi dostupnost','confirm-seller','data-id="'+e(o.id)+'"','')+b14('Predmet nije dostupan','reject-seller','data-id="'+e(o.id)+'"','ghost'):''}${o.sellerConfirmation==='CONFIRMED'&&!o.shipment&&o.status!=='CANCELLED'&&seller?b14('Ponovo proveri dostavu','prepare','data-id="'+e(o.id)+'"'):''}${o.status==='AWAITING_BUYER_DELIVERY_CONFIRMATION'&&buyer?'<span>Nova dostava: <b>'+D.money(o.proposedQuote?.amount||0)+'</b>; novo ukupno: <b>'+D.money(o.price+(o.proposedQuote?.amount||0))+'</b></span>'+b14('Prihvatam novu cenu dostave','accept-delivery','data-id="'+e(o.id)+'"',''):''}${!['CANCELLED','COMPLETED'].includes(o.status)&&['NOT_CREATED','CREATED'].includes(o.shipmentStatus)?b14('Zatraži otkazivanje','cancel-order','data-id="'+e(o.id)+'"','ghost'):''}${o.status==='COMPLETED'?b14('Oceni učesnika transakcije','rate','data-id="'+e(o.id)+'"'):''}</div>${o.integrationError?alertBox(e(o.integrationError),'orange','info'):''}${cases.map(c=>'<div class="support-ticket"><div class="row between wrap"><b>'+e(c.id)+'</b>'+badge(c.status)+'</div><p>'+e(c.reason)+' · '+e(c.owner)+'</p><p>'+e(c.nextAction)+'</p><small>Rok: '+(c.deadline?stamp(c.deadline):'potvrđuje nadležni tim po odobrenom postupku')+'</small></div>').join('')}${S.session.testing?'<details><summary>Probne radnje za rokove</summary><div class="row wrap">'+b14('+25 sati','advance-hours','data-hours="25"','ghost small')+b14('+73 sata','advance-hours','data-hours="73"','ghost small')+b14('Probna promena dostave +100 RSD','tariff-change','','ghost small')+'</div></details>':''}</section>`;
}
function orderDetail(id){const o=S.orders.find(x=>x.id===id);let html=orderDetail13(id);if(!o)return html;if(!S.session.testing){html=html.replace(/<details class="test-controls"[\s\S]*?<\/details>/,'');html=html.replace(/<div class="row wrap"><button class="btn ghost small" data-action="role-for-order"[\s\S]*?<\/div>/,'');html=html.replace(/<a[^>]*href="#\/admin\/disputes"[^>]*>[\s\S]*?<\/a>/,'');}return html.replace('<div class="checkout-layout">',orderWorkflow14(o)+'<div class="checkout-layout">');}
function detail(id){const l=S.listings.find(x=>x.id===id);let html=detail13(id);if(!l)return html;html=html.replace('<div class="name">'+e(S.users[l.seller]?.name),'<div class="name"><a href="#/people/'+e(l.seller)+'">'+e(S.users[l.seller]?.name)+'</a>');const notice='<section class="panel stack" style="margin-top:20px"><h3>O prodavcu i predmetu</h3><p>Predmet prodaje fizičko lice: <a href="#/people/'+e(l.seller)+'">'+e(S.users[l.seller]?.name)+'</a>. Prema svojoj izjavi ne obavlja trgovinu profesionalno; status može biti predmet dodatne provere.</p><p class="small muted">Platforma je eBex, aplikacija BEX-a. BEX pruža dostavu i naplatu pouzećem. Uslovi privatne prodaje i postupak rešavanja problema razlikuju se od kupovine od trgovca.</p><div class="detail-attrs"><div><span>Estetsko stanje</span><b>'+e(l.condition)+'</b></div><div><span>Ispravnost · navod prodavca</span><b>'+e(l.functionality||'Nije navedeno')+'</b></div></div>'+(l.defects?alertBox(e(l.defects),l.functionality!=='Ispravno'?'orange':'','info'):'')+(l.transportApproved===false?alertBox('Prevoz ovog predmeta još nije potvrđen. Kupovina je trenutno nedostupna.','orange','truck'):'')+'</section>';html=html.replace('<div class="section-heading"><div><h2>Možda ti se dopadne',notice+'<div class="section-heading"><div><h2>Možda ti se dopadne');return html;}
function publicProfile14(id){const u=S.users[id];if(!u)return empty('Profil nije pronađen.','Vrati se na oglase.',link('Oglasi','market'));const ratings=D.visibleRatings(S,id,ui.reputationSide||'buyer'),listings=S.listings.filter(l=>l.seller===id&&l.status==='ACTIVE');return `${crumb('Javni profil')}${head(u.name,'Član od '+date(u.sinceDate)+' · '+u.city,b14('Prijavi profil','report-profile','data-id="'+e(id)+'"','ghost'))}<section class="panel stack"><div class="row wrap">${u.phone?'<span class="badge green">Telefon potvrđen</span>':''}${u.identity?'<span class="badge green">Identitet dodatno proveren</span>':''}${u.bank?'<span class="badge green">Podaci za isplatu provereni</span>':''}</div><p class="small muted">Statusi na ovom testnom profilu su sintetički. Potvrda telefona sama ne potvrđuje identitet ili račun.</p><div class="stats">${stat('Realizovane prodaje',u.trades,'Početna demo istorija','box')}${stat('Prosek ocena',ratings.length?(ratings.reduce((n,r)=>n+r.rating,0)/ratings.length).toFixed(1):'—',ratings.length+' objavljenih ocena u ovoj ulozi','star')}</div><div class="row wrap">${b14('Ocene prodavca','reputation-side','data-id="buyer"',ui.reputationSide!=='seller'?'':'secondary')}${b14('Ocene kupca','reputation-side','data-id="seller"',ui.reputationSide==='seller'?'':'secondary')}</div>${ratings.length?ratings.map(r=>'<article class="review-card"><div class="row between"><b>'+r.rating.toFixed(1)+' / 5</b><small>'+date(r.at)+'</small></div><p>'+e(r.comment)+'</p><small>Transakcija: '+e(r.orderId)+'</small>'+b14('Prijavi ocenu','report-rating','data-id="'+e(r.id)+'"','ghost small')+'</article>').join(''):'<p class="muted">Nema objavljenih ocena u ovoj ulozi. Ocene se prikazuju kada obe strane ocene ili istekne odobreni testni rok.</p>'}</section><div class="section-heading"><div><h2>Aktivni oglasi</h2><p>${listings.length} oglasa</p></div></div><div class="product-grid">${listings.map(card).join('')}</div>`;}
function packing14(){return `${crumb('Pakovanje')}${head('Kako da upakuješ predmet','Kratko uputstvo za pripremu BEX pošiljke.')}<div class="two-col"><section class="panel stack">${[['Proveri predmet','Zabeleži ispravnost, opremu i poznate nedostatke. Ukloni lične podatke sa uređaja.'],['Zaštiti sadržaj','Koristi odgovarajuću čvrstu kutiju, obloži predmet i popuni prazan prostor. Predmet ne treba da se pomera.'],['Zatvori i označi paket','Zalepi sve spojeve i ukloni stare nalepnice. Konačna ambalaža mora odgovarati BEX pravilima.'],['Sačuvaj potrebne fotografije','Za vredniju ili rizičnu robu dodaj fotografije predmeta, zaštite i zatvorenog paketa na porudžbini. Serijski brojevi nisu javni.']].map((a,i)=>'<div><h3>'+(i+1)+'. '+a[0]+'</h3><p>'+a[1]+'</p></div>').join('')}</section><aside class="panel stack"><h3>Prema vrsti predmeta</h3><p><b>Elektronika:</b> isključi uređaj, zaštiti ekran i priključke; proveri odobrena pravila za baterije.</p><p><b>Tekstil:</b> zaštiti od vlage i koristi spoljašnju ambalažu.</p><p><b>Knjige:</b> zaštiti uglove i spreči pomeranje.</p><p><b>Lomljivo:</b> odvoji svaki deo i proveri da li BEX prihvata taj predmet i pakovanje.</p><p class="small muted">Ovo je radni vodič prototipa. Odobrena BEX pravila imaju prednost. Fotografije pomažu obradi problema i same ne garantuju ishod.</p>${link('Moje prodaje','seller','btn secondary')}</aside></div>`;}
function help14(){return `${crumb('Kako funkcioniše')}${head('Kupovina između ljudi, dostava preko BEX-a.','Kupuj i prodaj između ljudi. BEX dostava. Plaćanje pouzećem.')}<div class="help-grid panel"><div><h3>1. Pronađi predmet</h3><p>Izaberi „Kupi odmah” ili se dogovori kroz poruke i formalnu ponudu.</p></div><div><h3>2. Prodavac potvrđuje</h3><p>Predmet se rezerviše. Prodavac potvrđuje dostupnost pre pripreme slanja.</p></div><div><h3>3. BEX dostavlja</h3><p>Na adresu ili podržano mesto preuzimanja. Dostava se obračunava po standardnoj BEX tarifi.</p></div><div><h3>4. Plaćaš pri uručenju</h3><p>Ne plaćaš unapred kroz aplikaciju. Pregled sadržaja pre plaćanja zavisi od odobrene BEX usluge.</p></div></div><section class="panel stack" style="margin-top:20px"><h2>Problem sa kupovinom, dostavom ili sumnja na prevaru?</h2><p>Na detalju porudžbine izaberi „Prijavi problem”. Podrška prikuplja podatke i prosleđuje ih odgovarajućem timu. Problem sa robom i reklamacija na poštansku uslugu vode se odvojeno.</p><p>Prijava sama ne zaustavlja isplatu. Zadržavanje, povrat robe i povraćaj novca zavise od pravnog osnova i potvrđenog BEX postupka. Naknadni spor ne poništava potvrđenu isplatu.</p><p class="small muted">Prava i rokovi u javnoj produkcionoj verziji moraju biti potvrđeni od pravne službe. U prototipu nema stvarnog prenosa novca, garancije isplate narednog dana ili odobrene automatske refundacije.</p>${link('Pakovanje predmeta','packing','btn secondary')}</section>`;}

function rateModal14(id){openModal('Oceni učesnika transakcije','Ocena je povezana sa završenom porudžbinom '+e(id)+'.',`<form id="v14-rating-form" data-id="${e(id)}" class="stack"><div data-error></div>${[['accuracy','Tačnost opisa / dogovora'],['communication','Komunikacija'],['agreement','Poštovanje dogovora']].map(([k,t])=>'<label class="field">'+t+'<select name="'+k+'">'+options(['5','4','3','2','1'],'5')+'</select></label>').join('')}<label class="field">Komentar<textarea name="comment" minlength="5" maxlength="500" required></textarea></label><p class="small muted">Ocene za kupca i prodavca vode se odvojeno. Objavljuju se kada obe strane ocene ili prođe ${S.config.ratingPublishDays} dana u probnom modelu. BEX anketa je odložena.</p><button class="btn" type="submit">Sačuvaj ocenu</button></form>`);}

function audit14(){return `${crumb('Pregled izmena v1.4')}${head('Prvo pregled postojećeg, zatim izmene.','Audit je urađen pre razvoja na stvarnom prototipu v1.3.')}<section class="panel stack"><p>Sačuvani su katalog sa odobravanjem, CSV/XLSX uvoz, zalihe i istorija rezervacija, 15 prodavčevih izveštaja, chat i formalne ponude, odvojeni novčani statusi i audit. Pre izmena je prošlo 37/37 postojećih lokalnih testova.</p>${table(['Zahtev','Nalaz v1.3','Izmena v1.4','Status prototipa'],[
 ['14-01','Slogan postoji; neujednačen rečnik','Svrha, korisnički nazivi, bez lažnih garancija','IMPLEMENTIRANO'],['14-02','Katalog i OCR tok postoje','Šest osnovnih polja, sve potkategorije, ispravnost i greške po polju','IMPLEMENTIRANO'],['14-03','C2C količina i moderacija postoje','Izjava aktivnosti i pregled identičnih novih predmeta','IMPLEMENTIRANO'],['14-04','Cena, favoriti i sortiranje postoje','Filteri po kontekstu; telefon samo u potkategoriji telefona','IMPLEMENTIRANO'],['14-05','Rezervacija i idempotentnost postoje','Potvrda prodavca, rokovi, novi obračun i saglasnost','IMPLEMENTIRANO'],['14-06','Nulti popust i doplata testirani','COD lokacije, preferencija i ponovna provera','IMPLEMENTIRANO · LOKALNI MOCK'],['14-07','Dokaz pakovanja već postoji','Vodič i ciljano obavezne fotografije','IMPLEMENTIRANO'],['14-08','Spor i novac već odvojeni','Jedna prijava i prikaz odgovornog tima','IMPLEMENTIRANO'],['14-09','Privatni profil i jedna ocena postoje','Javni profil i odvojene obostrane ocene','IMPLEMENTIRANO'],['14-10','Centar obaveštenja postoji','Deduplikacija rokova i odvojena saglasnost','IMPLEMENTIRANO · IN-APP'],['14-11','RBAC i audit postoje','Interni prikaz i mere samo na eBex-u','IMPLEMENTIRANO · UI SIMULACIJA'],['14-12','15 grupa izveštaja postoji','Odnos dostave i vrednosti; P2 opcije ostaju odložene','DELIMIČNO · P2 ODLOŽENO']])}</section><section class="panel stack" style="margin-top:20px"><h2>Otvorene odluke i granica testiranja</h2><p>Predlozi za ovu probu: potvrda prodavca ${S.config.sellerConfirmHours} h, priprema slanja ${S.config.dispatchHours} h. Menjaju se u postojećoj administraciji. Vlasnik proizvoda i BEX operativa treba da odobre rokove, radne dane, posledice i izuzetke pre produkcije.</p><p>Standardni BEX cenovnik, COD lokacije, novčani događaji, SMS/KYC i AI/OCR su lokalne simulacije. Zvanični sandbox nije povezan. Server autorizacija, stvarne konkurentne transakcije, MFA i zasebne iOS/Android aplikacije nisu implementirani u ovom HTML-u.</p><p>Produkcioni status: <b>NIJE ODOBRENO ZA PRODUKCIJU</b>. Nedostaju API ugovori, pravna matrica, potvrđeni tokovi, bezbednosni i native testovi. P2 BEX anketa i objedinjene pošiljke nisu aktivirani.</p><p>Odgovorni pre produkcije: BEX IT (API i lokacije), pravna služba (status prodavca, rokovi i novčani tok), finansije (isplata/povrat), product i operativa (rokovi i pakovanje), security (RBAC/MFA). Rok: pre pilot produkcije; odobrenje nije dostavljeno.</p>${link('Pokreni lokalne provere','test','btn secondary')}${link('Registar odluka iz v1.3','admin/readiness','text-btn')}</section>`;}
function safety14(){return `${head('Prijave i ograničenja naloga','Ograničenje važi samo za eBex. Drugi BEX servisi se ne menjaju.')}<section class="panel stack"><form id="v14-restriction-form" class="stack"><div data-error></div><label class="field">Korisnik<select name="userId">${options(Object.values(S.users), 's1')}</select></label><label class="field">Razlog i dokazi<textarea name="reason" minlength="10" required></textarea></label><label class="checkline"><input type="checkbox" name="permanent">Predlog trajnog ograničenja — zahteva drugo ovlašćeno lice</label><button class="btn secondary" type="submit">Evidentiraj meru</button></form>${table(['Nalog','Razlog / prigovor','Status','Akcija'],S.restrictions.map(r=>[e(S.users[r.userId]?.name),e(r.reason)+'<br><small>'+e(r.appeal)+'</small>',badge(r.status),r.status==='PENDING_APPROVAL'?b14('Odobri kao drugo lice','approve-restriction','data-id="'+e(r.id)+'"','secondary small'):r.status==='ACTIVE'?b14('Vrati nalog uz obrazloženje','restore-user','data-id="'+e(r.id)+'"','secondary small'):'—']))}</section>`;}

 if(full==='account'){ev.preventDefault();ev.stopImmediatePropagation();const prev=$('.menu-pop');if(prev){prev.remove();return;}const menu=document.createElement('div');menu.className='menu-pop';menu.innerHTML='<div class="role-label">Moj nalog</div>'+[['buyer','Kupac','user'],['seller','Prodavac','tag'],...(S.session.testing?[['admin','Interni administrator','sliders']]:[])].map(r=>'<button data-action="role" data-id="'+r[0]+'">'+I(r[2])+r[1]+'</button>').join('')+'<hr><button data-action="profile">'+I('user')+'Profil i podešavanja</button>'+(S.session.testing?'<button data-action="test-page">'+I('play')+'Test centar</button><button data-action="v14-exit-testing">Zatvori interno testiranje</button>':'<a class="btn ghost small" href="#/testing">Interni pristup prototipu</a>');$('.header').append(menu);return;}
 if(!full.startsWith('v14-'))return;ev.preventDefault();ev.stopImmediatePropagation();const a=full.slice(4);
 try{switch(a){
 case 'clear-context':ui.subcategory='';ui.brand='';ui.model='';ui.attributeFilters={};render();break;
 case 'suggest-category':{rememberDraft();const p=D.suggestCategory(S,ui.draft.title+' '+ui.draft.description);ui.categorySuggestion=p;openModal('Predlog kategorije','Predlog je pomoć pri unosu; potvrda ostaje na tebi.',p?'<div class="stack"><p>Predlog: <b>'+e(S.catalog.categories.find(c=>c.id===p.category)?.name)+' → '+e(S.catalog.categories.find(c=>c.id===p.subcategory)?.name)+'</b></p><p class="small muted">Lokalni demonstracioni predlog; ne koristi pravi AI servis.</p>'+b14('Prihvati kategoriju','accept-category','','')+b14('Odbij predlog','reject-category','','ghost')+'</div>':'<div class="stack"><p>Nema dovoljno pouzdanog predloga. Izaberi kategoriju ručno.</p>'+btn('Zatvori','close')+'</div>');break;}
 case 'accept-category':if(ui.categorySuggestion){Object.assign(ui.draft,{category:ui.categorySuggestion.category,subcategory:ui.categorySuggestion.subcategory,brand:'',model:''});ui.categorySuggestion=null;}closeModal();render();break;

document.addEventListener('change',async ev=>{
 const el=ev.target;if(!el.dataset.vchange&&!el.dataset.vupload&&el.dataset.vcolumn===undefined)return;ev.stopImmediatePropagation();
 try{
 if(el.dataset.vcolumn!==undefined){const i=Number(el.dataset.vcolumn),set=new Set(ui.hiddenCols||[]);if(el.checked)set.delete(i);else set.add(i);if(set.size>=reportData().headers.length)throw Error('Ostavi makar jednu kolonu.');ui.hiddenCols=[...set];render();}
 if(el.dataset.vchange){const k=el.dataset.vchange;if(k==='custom-base'){ui.customBase=el.value;ui.hiddenCols=[];render();return;}rememberDraft();const d=ui.draft;if(k==='category'){d.subcategory=categoryChildren(d.category)[0]?.id||'';d.brand='';d.model='';}if(k==='subcategory'){d.brand='';d.model='';}if(k==='brand'){d.family='';d.model=d.brand==='other'?'manual':'';d.variant='';}if(k==='family'){d.model='';d.variant='';}if(k==='model'){const m=getModel(d.model);d.manualModel=d.model==='manual';if(m){d.brand=m.brand;d.family=m.family;d.variant=m.variants[0];if(!d.title)d.title=m.name+' · polovan';}}render();}
 if(el.dataset.vupload){const fs=Array.from(el.files||[]);if(!fs.length)return;const kind=el.dataset.vupload;
  if(kind==='photos'){rememberDraft();if(fs.length+ui.draft.photos.length>5)throw Error('Dodaj najviše 5 fotografija.');const photos=[];for(const f of fs)photos.push(await readPhoto(f));ui.draft.photos.push(...photos.map(p=>p.data));render();}
  if(kind==='document'){const name=await validateDocument(fs[0]);showProposals('good',name);}
  if(kind==='table'){const file=fs[0];if(file.size>S.config.importMaxMB*1024*1024)throw Error('Tabela je prevelika.');if(!/\.(csv|xlsx)$/i.test(file.name))throw Error('Dozvoljeni su CSV i XLSX.');const table=/\.xlsx$/i.test(file.name)?await window.FileTables.readXLSX(await file.arrayBuffer()):D.parseCSV(await file.text());if(table.length-1>S.config.importMaxRows)throw Error('Tabela premašuje testnu kvotu.');loadTable(table,file.name);toast('Tabela je učitana. Proveri mapiranje pre kreiranja nacrta.');}
 }
 }catch(err){toast(err.message,true);if(el.type==='file')el.value='';}
},true);

 case 'moderate':if(!D.can(S,'moderate'))throw Error('Ova uloga nema pravo moderacije.');openModal('Odluka o oglasu.','Obrazloženje se čuva u revizijskom tragu.',`<form id="moderation-form" data-id="${e(id)}" data-decision="${e(target.dataset.decision)}" class="stack"><div data-error></div><label class="field">Obrazloženje<textarea name="reason" minlength="10" required placeholder="Razlog odluke…"></textarea></label><button type="submit" class="btn">${target.dataset.decision==='approve'?'Odobri objavu':'Ukloni oglas'}</button></form>`);break;
 case 'statement':commit(s=>{D.requirePermission(s,'reconcile');s.statement=s.orders.filter(o=>o.codStatus==='COLLECTED').map(o=>({orderId:o.id,amount:o.total}));D.audit(s,'ADMIN:'+s.session.adminRole,'DEMO_STATEMENT','Generisan testni BEX izvod.');});render();break;
 case 'statement-mismatch':commit(s=>{D.requirePermission(s,'reconcile');if(!s.statement?.length)throw Error('Izvod nema COD transakcije.');s.statement[0].amount+=10000;D.audit(s,'DEMO','STATEMENT_MISMATCH','Dodata probna razlika +100 RSD.');});render();break;
 case 'reconcile':commit(s=>{D.requirePermission(s,'reconcile');const differences=s.statement.filter(x=>x.amount!==s.ledger.filter(l=>l.orderId===x.orderId&&l.type==='COD').reduce((a,l)=>a+l.amount,0));D.audit(s,'ADMIN:'+s.session.adminRole,'RECONCILIATION','Broj razlika: '+differences.length);});toast('Provera je evidentirana. Razlike ostaju vidljive za ručni pregled.');break;
 case 'export-ledger':if(S.session.role!=='admin'||!['super','finance','auditor'].includes(S.session.adminRole))throw Error('Nedovoljno ovlašćenje za finansijski izvoz.');download('eBex_finansijska_evidencija.csv',csv([['Vreme','Porudžbina','Tip','Iznos RSD','Dugovna strana','Potražna strana','Referenca'],...S.ledger.map(x=>[x.at,x.orderId,x.type,x.amount/100,x.debit,x.credit,x.ref])]),'text/csv;charset=utf-8');break;
 case 'export-audit':if(S.session.role!=='admin')throw Error('Potreban je administratorski nalog.');download('eBex_revizijski_trag.csv',csv([['Vreme','Akter','Radnja','Opis','Referenca'],...S.audit.map(x=>[x.at,x.actor,x.action,x.detail,x.ref])]),'text/csv;charset=utf-8');break;
 case 'scenario':scenario(id);break;
 case 'run-tests':ui.tests=window.runEBTests();render();toast('Provere završene: '+ui.tests.filter(t=>t.pass).length+'/'+ui.tests.length+'.',ui.tests.some(t=>!t.pass));break;
 case 'export':download('eBex_testni_podaci_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(S,null,2));toast('Testni podaci su izvezeni kao JSON.');break;
 case 'reset':openModal('Vrati početne testne podatke?','Sačuvaj svoje testiranje pre vraćanja početnog stanja.',`<div class="stack"><p class="muted">Izvoz čuva trenutne oglase, razgovore i transakcije. Početno stanje će ponovo sadržati demo katalog i dve probne porudžbine.</p>${btn('Prvo izvezi JSON','export','','secondary')}${btn('Vrati demo podatke','confirm-reset')}${btn('Zadrži trenutno stanje','close','','ghost')}</div>`);break;
 case 'confirm-reset':{const before=D.clone(S);download('eBex_rezervna_kopija_pre_reseta.json',JSON.stringify(before,null,2));commit(s=>{const fresh=D.seed();Object.keys(s).forEach(k=>delete s[k]);Object.assign(s,fresh);});Object.assign(ui,{query:'',category:'all',limit:8,tests:[],checkout:null});closeModal();go('market');toast('Početni podaci su vraćeni. Prethodno stanje je izvezeno u JSON.');break;}
 case 'label':{const o=D.order(S,id);if(!o.shipment)throw Error('Pošiljka još nije kreirana.');download('eBex_TEST_nalepnica_'+id+'.html',`<!doctype html><html lang="sr-Latn"><meta charset="utf-8"><title>Testna nalepnica</title><style>body{font:16px Arial;margin:45px;color:#222}.label{max-width:600px;border:2px solid #222;padding:30px}h1{font-size:25px}h2{font-size:17px}.test{border:3px solid #b44;padding:15px;color:#b44;font-weight:bold}small{color:#777}</style><div class="label"><div class="test">TEST · NIJE VAŽEĆA BEX NALEPNICA</div><h1>eBex · ${e(id)}</h1><h2>${e(o.snapshot.title)}</h2><p>Referenca: ${e(o.shipment)}</p><p>Testno pouzeće: ${D.money(o.total)}</p><p>Test primalac: ${e(o.address?.name||'Demo kupac')}</p><p>${e(o.address?.street||'Test adresa')} · ${e(o.address?.city||'Test grad')}</p><small>Bez validnog barkoda. Ne koristiti za stvarno slanje.</small></div></html>`,'text/html;charset=utf-8');break;}
 case 'review':rateModal14(id);break;
 default:toast('Radnja nije prepoznata.',true);
 }}catch(err){toast(err.message,true);}
});

function verificationModal(kind){const titles={phone:'Telefon',email:'E-mail',identity:'Identitet',bank:'Račun za isplatu'};let fields='';if(kind==='phone')fields='<label class="field">Demo SMS kod<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="123456" required autocomplete="off"></label>'+alertBox('Demo kod je <b>123456</b>. SMS se ne šalje. Posle 5 pogrešnih pokušaja blokira se provera na 60 sekundi.','orange','info');else if(kind==='bank')fields='<label class="field">Ime vlasnika testnog računa<input name="owner" value="'+e(S.users.me.bankOwner||S.users.me.name)+'" required maxlength="80"></label>'+alertBox('Ne unosi stvaran broj računa. Proveravamo samo princip: ime vlasnika mora odgovarati prodavcu.','orange','wallet');else fields=alertBox(kind==='email'?'Potvrđuješ samo testni status e-maila. Ne unosi se adresa i nema slanja poruke.':'Potvrđuješ samo testni KYC status. Ne prikupljaju se dokumenta ni biometrijski podaci.','orange','shield');openModal(titles[kind]+' · testna verifikacija.','Odvojen status verifikacije, bez stvarnih servisnih poziva.',`<form id="verify-form" data-id="${kind}" class="stack"><div data-error></div>${fields}<label class="checkline"><input type="checkbox" name="consent" required>Razumem da je ovo simulirana verifikacija.</label><button class="btn" type="submit">Potvrdi demo status</button>${S.users.me[kind]?btn('Ukloni postojeću demo potvrdu','unverify','data-id="'+kind+'"','ghost'):''}</form>`);}
document.addEventListener('submit',ev=>{
 const form=ev.target;if(!(form instanceof HTMLFormElement))return;ev.preventDefault();const f=Object.fromEntries(new FormData(form));const id=form.dataset.id;
 try{switch(form.id){
 case 'search-form':ui.query=String(f.q||'').trim();ui.limit=8;go('market');render();break;
 case 'filter-form':if((f.min&&(!Number.isFinite(amount(f.min))||amount(f.min)<0))||(f.max&&(!Number.isFinite(amount(f.max))||amount(f.max)<0)))throw Error('Unesi važeće iznose u RSD.');if(f.min&&f.max&&amount(f.min)>amount(f.max))throw Error('Donja cena ne može biti viša od gornje.');Object.assign(ui,{min:f.min,max:f.max,condition:f.condition,city:f.city,mode:f.mode,limit:8});render();break;
 case 'checkout-form':{if(!f.terms)throw Error('Potvrdi pravila testne kupovine.');if(!ui.checkout)throw Error('Ponovo otvori kupovinu.');const c=ui.checkout,o=commit(s=>D.createOrder(s,{listingId:c.id,offerId:c.offerId,address:{name:f.name.trim(),street:f.street.trim(),city:f.city.trim(),postal:f.postal.trim()},delivery:f.delivery,requestId:c.requestId}));ui.checkout=null;go('orders/'+o.id);toast('Testna kupovina je potvrđena. BEX pošiljka je simulirana.');break;}
 case 'message-form':commit(s=>D.sendMessage(s,id,String(f.message||'')));render();break;
 case 'offer-form':commit(s=>D.makeOffer(s,id,amount(f.price)));closeModal();render();toast('Ponuda je poslata. Promeni ulogu da je prihvati druga strana.');break;
 case 'complaint-form':commit(s=>D.complain(s,id,f.reason,f.description,ui.complaintPhotos||[]));closeModal();render();toast('Reklamacija je otvorena i finansijski status ažuriran.');break;
 case 'dispute-decision':commit(s=>D.decide(s,id,f.decision,f.reason));render();toast('Odluka je evidentirana sa obrazloženjem.');break;
 case 'listing-form':{rememberDraft(form);if(ui.draft.step===1){if(!ui.draft.photos.length)throw Error('Dodaj fotografiju ili izaberi demo ilustraciju.');if(ui.draft.title.trim().length<5||ui.draft.description.trim().length<20)throw Error('Dopuni naslov i opis.');ui.draft.step=2;render();}else if(ui.draft.step===2){if(!Number.isSafeInteger(ui.draft.price)||ui.draft.price<=0)throw Error('Unesi važeću cenu u RSD.');ui.draft.step=3;render();}else{const l=commit(s=>{const l=D.publish(s,{...ui.draft,ownership:!!f.ownership,art:categoryArt(ui.draft.category)});delete s.draft;return l;});ui.draft={step:1,photos:[],category:'tech',mode:'buy',condition:'Kao novo',city:'Beograd',weight:1,dims:[30,20,15]};go('listing/'+l.id);toast(l.status==='ACTIVE'?'Oglas je objavljen besplatno.':'Oglas je zadržan za pregled zbog sadržaja.');}break;}
 case 'edit-listing-form':commit(s=>{const l=s.listings.find(l=>l.id===id);if(l.seller!=='me'||l.status!=='ACTIVE')throw Error('Oglas se više ne može menjati.');const price=amount(f.price);if(!Number.isSafeInteger(price)||price<=0)throw Error('Unesi važeću cenu.');l.title=f.title.trim();l.description=f.description.trim();l.price=price;const bad=D.contactViolation(l.title+' '+l.description);if(bad){l.status='PENDING_REVIEW';s.moderation.unshift({id:D.uid('mod'),listingId:id,reason:bad,status:'OPEN',at:D.now()});}D.audit(s,'me','LISTING_EDITED',l.title,id);});closeModal();render();toast('Izmene oglasa su sačuvane.');break;
 case 'promote-form':commit(s=>D.promote(s,f.listing,id));closeModal();render();toast('Demo promocija je aktivna. Nema naplate.');break;
 case 'profile-form':commit(s=>{const u=s.users.me;const changed=u.name!==f.name.trim();u.name=f.name.trim();u.city=f.city.trim();u.bio=f.bio.trim();u.initials=u.name.split(/\s+/).slice(0,2).map(t=>t[0]).join('').toUpperCase();if(changed){u.identity=false;u.bank=false;}D.audit(s,'me','PROFILE_UPDATED',changed?'Promena imena resetuje identitet i račun.':'Izmena profila.');});render();toast('Profil je sačuvan.');break;
 case 'verify-form':{const t=Date.now();if(id==='phone'){if((ui.otpBlockedUntil||0)>t)throw Error('Sačekaj kraj testne blokade od 60 sekundi.');if(f.code!=='123456'){ui.otpAttempts=(ui.otpAttempts||0)+1;if(ui.otpAttempts>=5){ui.otpBlockedUntil=t+60000;ui.otpAttempts=0;}throw Error('Pogrešan demo kod. Ispravan kod je 123456.');}}if(!f.consent)throw Error('Potvrdi da je ovo simulacija.');commit(s=>{if(id==='bank'){if(D.normalized(f.owner.trim())!==D.normalized(s.users.me.name))throw Error('Račun trećeg lica se odbija. Ime vlasnika mora biti isto.');s.users.me.bankOwner=f.owner.trim();}s.users.me[id]=true;s.consents.push({kind:'DEMO_VERIFICATION',type:id,version:'prototype-1.1',at:D.now()});D.audit(s,'me','DEMO_VERIFICATION',id);});ui.otpAttempts=0;closeModal();render();toast('Testna verifikacija je potvrđena.');break;}
 case 'report-form':commit(s=>{if(f.reason.trim().length<10)throw Error('Dodaj konkretniji razlog prijave.');if(form.dataset.kind==='chat'&&f.block)s.conversations.find(c=>c.id===form.dataset.ref).blocked=true;D.audit(s,'me',form.dataset.kind==='chat'?'CHAT_REPORTED':'LISTING_REPORTED',f.reason,form.dataset.ref);});closeModal();render();toast('Prijava je evidentirana za testni pregled.');break;
 case 'moderation-form':commit(s=>{D.requirePermission(s,'moderate');const l=s.listings.find(l=>l.id===id);if(f.reason.trim().length<10)throw Error('Obrazloži odluku.');if(form.dataset.decision==='approve'){const bad=D.contactViolation(l.title+' '+l.description);if(bad)throw Error('Kontakt podaci moraju biti uklonjeni iz oglasa pre odobrenja.');l.status='ACTIVE';}else l.status='REMOVED';s.moderation.filter(m=>m.listingId===id).forEach(m=>m.status='RESOLVED');D.audit(s,'ADMIN:'+s.session.adminRole,'MODERATION_'+l.status,f.reason,id);});closeModal();render();toast('Moderatorska odluka je sačuvana.');break;
 case 'config-form':commit(s=>{if(s.session.role!=='admin'||s.session.adminRole!=='super')throw Error('Poslovna pravila menja super administrator.');for(const k of ['shippingBase','shippingPerKg','shopDiscount','proofThreshold']){const n=amount(f[k]);if(!Number.isSafeInteger(n)||n<0)throw Error('Proveri cene i pragove.');s.config[k]=n;}for(const k of ['maxKg','maxCm','dispatchHours','payoutDays']){const n=Number(f[k]);if(!Number.isFinite(n)||n<=0)throw Error('Proveri mase, dimenzije i rokove.');s.config[k]=n;}s.config.holdSupported=!!f.holdSupported;s.configVersion=(s.configVersion||1)+1;D.audit(s,'ADMIN:super','CONFIG_CHANGED','Verzija '+s.configVersion);});render();toast('Testna konfiguracija je sačuvana. Postojeće porudžbine zadržavaju ugovorene iznose.');break;
 case 'plans-form':commit(s=>{if(s.session.role!=='admin'||s.session.adminRole!=='super')throw Error('Katalog menja super administrator.');for(const p of s.config.plans){const price=amount(f[p.id+'_price']),days=Number(f[p.id+'_days']);if(!Number.isSafeInteger(price)||price<0||!Number.isInteger(days)||days<1||days>365)throw Error('Proveri cene i trajanje paketa.');Object.assign(p,{name:f[p.id+'_name'].trim(),price,days,description:f[p.id+'_description'].trim()});}D.audit(s,'ADMIN:super','PREMIUM_CONFIG','Izmenjen testni katalog.');});render();toast('Premium katalog je ažuriran.');break;
 case 'review-form':commit(s=>{const o=D.order(s,id);if(o.status!=='COMPLETED'||s.ratings.some(r=>r.orderId===id))throw Error('Ocena je dozvoljena jednom za završenu transakciju.');const bad=D.contactViolation(f.comment);if(bad)throw Error(bad);s.ratings.push({orderId:id,rating:Number(f.rating),comment:f.comment,at:D.now()});D.audit(s,'me','RATING_CREATED',f.rating+' zvezdica',id);});closeModal();render();toast('Testna ocena je sačuvana.');break;
 }}catch(err){formError(form,err);}
});
document.addEventListener('change',async ev=>{
 const el=ev.target;try{
 if(el.dataset.change==='sort'){ui.sort=el.value;render();}
 else if(el.dataset.change==='admin-role'){commit(s=>{s.session.adminRole=el.value;D.audit(s,'DEMO','ADMIN_ROLE_CHANGED',el.value);});render();}
 else if(el.dataset.change==='delivery'){if(ui.checkout){ui.checkout.delivery=el.value;const l=S.listings.find(l=>l.id===ui.checkout.id);$('#shipping-summary').textContent=D.money(D.quote(S,l.weight,el.value));$('#total-summary').textContent=D.money(ui.checkout.price+D.quote(S,l.weight,el.value));}}
 if(el.dataset.upload){
  const kind=el.dataset.upload,files=Array.from(el.files||[]);if(!files.length)return;
  if(kind==='import'){if(files[0].size>12e6)throw Error('JSON izvoz je prevelik.');const raw=await files[0].text(),loaded=D.validateImport(JSON.parse(raw));if(!Array.isArray(loaded.favorites)||!Array.isArray(loaded.notifications)||!Array.isArray(loaded.moderation)||!Array.isArray(loaded.config.plans)||!loaded.session)throw Error('Testni izvoz nema potrebne sekcije.');if(/"(?:__proto__|constructor|prototype)"\s*:/.test(raw))throw Error('Nevažeća polja testnog izvoza.');download('eBex_kopija_pre_uvoza.json',JSON.stringify(S,null,2));commit(s=>{Object.keys(s).forEach(k=>delete s[k]);Object.assign(s,loaded);D.audit(s,'DEMO','IMPORT','Uvezen testni JSON.');});go('test');render();toast('Uvezeni su testni podaci. Prethodno stanje je sačuvano kao JSON.');return;}
  if(files.length>5)throw Error('Dodaj najviše 5 fotografija odjednom.');
  if(kind==='listing')rememberDraft();
  const photos=[];for(const file of files)photos.push(await readPhoto(file));
  if(kind==='listing'){if(ui.draft.photos.length+photos.length>5)throw Error('Oglas može imati najviše 5 fotografija.');ui.draft.photos.push(...photos.map(p=>p.data));render();}
  else if(kind==='proof'){commit(s=>D.addEvidence(s,el.dataset.id,photos));render();toast('Fotografije pakovanja su dodate.');}
  else if(kind==='complaint'){ui.complaintPhotos=photos;$('#complaint-photos').innerHTML=photos.map(p=>'<img src="'+e(p.data)+'" alt="'+e(p.name)+'">').join('');}
 }
 }catch(err){toast(err.message,true);el.value='';}
});
document.addEventListener('input',ev=>{if(ev.target.id==='audit-search')$('#audit-rows').innerHTML=auditRows(ev.target.value);});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){closeModal();$('.menu-pop')?.remove();}if(ev.key==='Tab'&&$('#modals .modal')){const els=Array.from($('#modals .modal').querySelectorAll('button,a[href],input,select,textarea')).filter(el=>!el.disabled&&el.offsetParent!==null);if(!els.length)return;const first=els[0],last=els[els.length-1];if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus();}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus();}}});
window.addEventListener('hashchange',()=>{closeModal();ui.listingPhoto=null;render();window.scrollTo({top:0,behavior:'instant'});});
window.addEventListener('storage',ev=>{if(ev.key===STORAGE&&ev.newValue){try{S=D.validateImport(JSON.parse(ev.newValue));toast('Testni podaci su promenjeni u drugoj kartici. Osveži prikaz ako je potrebno.');}catch(err){toast('Podaci iz druge kartice nisu ispravni.',true);}}});
if(S.draft)ui.draft={...freshDraft(),...D.clone(S.draft)};
if(!S.draft)ui.draft=freshDraft();
window.EBPreview={getState:()=>D.clone(S),getReport:()=>D.clone(reportData()),version:'1.4'};
if(typeof setInterval==='function')setInterval(()=>{const p=D.clone(S);if(D.processDeadlines(p)){commit(s=>Object.assign(s,p));render();}},30000);
if(!location.hash)location.hash='/market';else render();
})();
